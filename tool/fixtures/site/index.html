<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture home</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="cookie-banner" role="dialog" aria-label="Cookies">
      <span>We use cookies.</span>
      <button type="button">Decline</button>
      <button type="button">Accept</button>
    </div>
    <header class="site-head">
      <a class="brand" href="/">Fixture</a>
      <nav aria-label="Primary">
        <a href="/about.html">About</a>
        <a href="/docs.html">Docs</a>
        <a href="/private.html">Private</a>
      </nav>
      <div class="theme">
        <button type="button" aria-label="Light theme">Light</button>
        <button type="button" aria-label="Dark theme">Dark</button>
      </div>
    </header>
    <main id="main" class="page">
      <h1 class="title">Fixture home</h1>
      <p class="lead">A small deterministic page for the cloning pipeline.</p>
      <section class="cards" aria-label="Cards">
        <article class="card">
          <h2 class="card__title">First</h2>
          <p class="card__desc">One stable card.</p>
          <div class="card__stage"><button type="button">Open</button></div>
        </article>
        <article class="card">
          <h2 class="card__title">Second</h2>
          <p class="card__desc">Another stable card.</p>
          <div class="card__stage"><button type="button">Open</button></div>
        </article>
        <article class="card">
          <h2 class="card__title">Third</h2>
          <p class="card__desc">The last stable card.</p>
          <div class="card__stage"><button type="button">Open</button></div>
        </article>
      </section>
      <section class="extras">
        <details>
          <summary>More</summary>
          <p>Hidden detail.</p>
        </details>
        <div class="tabs" role="tablist" aria-label="Example tabs">
          <button type="button" role="tab" aria-selected="true" data-tab="a">Tab A</button>
          <button type="button" role="tab" aria-selected="false" data-tab="b">Tab B</button>
        </div>
        <div id="panel-a">Panel A</div>
        <div id="panel-b" hidden>Panel B</div>
        <button type="button" data-open-dialog>Open dialog</button>
        <dialog>
          <p>Dialog body.</p>
          <button type="button" data-close-dialog>Close</button>
        </dialog>
        <div id="shadow-host"></div>
        <iframe src="/frame.html" title="Frame" width="300" height="120"></iframe>
        <img src="/logo.svg" alt="Fixture logo" loading="lazy" width="40" height="40" />
        <canvas width="120" height="60"></canvas>
        <span id="clock">--:--</span>
      </section>
    </main>
    <footer class="site-foot"><span>Fixture footer</span></footer>
    <script src="/app.js"></script>
  </body>
</html>
